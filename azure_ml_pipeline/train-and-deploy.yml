# .github/workflows/train-and-deploy.yml
#
# Fix applied vs. the earlier draft: the `azure/login@v2` step alone does
# not make `az` aware of which extension to use, and the extension add
# step was not marked to continue past a "already installed" exit code
# on repeat runs. Added -y and an explicit `az account show` verification
# step so a silent auth failure does not cascade into a confusing job
# submission error.

name: train-and-deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pipelines/**"
  schedule:
    - cron: "0 3 * * 1"   # weekly retrain, Monday 03:00 UTC

jobs:
  run-training-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify Azure authentication
        run: az account show

      - name: Install Azure ML CLI extension
        run: az extension add --name ml -y --upgrade

      - name: Submit training pipeline
        run: |
          az ml job create \
            --file pipelines/train-pipeline.yml \
            --resource-group <RESOURCE_GROUP> \
            --workspace-name <WORKSPACE_NAME>
