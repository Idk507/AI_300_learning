$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: train_churn_model
display_name: Train churn model
version: 1
type: command
inputs:
  training_data: {type: uri_folder}
outputs:
  model_output: {type: uri_folder}
code: ./components/train
environment: azureml:AzureML-sklearn-1.0-ubuntu20.04-py38-cpu@latest
command: >-
  python train.py --training_data ${{inputs.training_data}} --model_output ${{outputs.model_output}}
  